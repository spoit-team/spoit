name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # 테스트용 MySQL (CI 실행 중에만 잠깐 떠 있는 컨테이너)
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: test # CI 전용 임시 비밀번호 (운영 비밀번호 아님)
          MYSQL_DATABASE: spoit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/spoit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: test

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: JDK 17 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정 (캐시 포함)
        uses: gradle/actions/setup-gradle@v5

      - name: 스키마 적용 (db/schema.sql이 있을 때만)
        run: |
          if [ -f db/schema.sql ]; then
            mysql -h 127.0.0.1 -P 3306 -uroot -ptest --default-character-set=utf8mb4 spoit < db/schema.sql
          else
            echo "db/schema.sql 없음 - 건너뜀"
          fi

      - name: 빌드 및 테스트
        run: |
          chmod +x gradlew
          ./gradlew build
