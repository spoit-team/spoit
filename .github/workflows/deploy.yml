name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능

# 배포는 한 번에 하나만 (진행 중인 배포는 취소하지 않고 순서대로)
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/spoit

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 및 업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: EC2에 배포
        env:
          TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            ec2-user@${{ secrets.EC2_HOST }} \
            "IMAGE=${IMAGE} TAG=${TAG} bash -s" <<'EOF'
          set -e
          echo "▶ 이미지 받기: ${IMAGE}:${TAG}"
          docker pull "${IMAGE}:${TAG}"

          echo "▶ 기존 컨테이너 교체"
          docker stop spoit 2>/dev/null || true
          docker rm spoit 2>/dev/null || true
          docker run -d --name spoit \
            --restart unless-stopped \
            -p 80:8080 \
            --env-file /home/ec2-user/spoit/.env \
            "${IMAGE}:${TAG}"

          echo "▶ 기동 확인 (최대 3분)"
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/ || true)
            if [ "$code" != "000" ]; then
              echo "응답 확인 (HTTP $code)"
              break
            fi
            if [ "$i" = "36" ]; then
              echo "기동 실패 - 최근 로그:"
              docker logs --tail 80 spoit
              exit 1
            fi
            sleep 5
          done

          echo "▶ 7일 지난 미사용 이미지 정리"
          docker image prune -af --filter "until=168h"
          EOF

      - name: SSH 키 삭제
        if: always()
        run: rm -f ~/.ssh/deploy_key
