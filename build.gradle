plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'co.kr'
version = '0.0.1-SNAPSHOT'

// 미리보기 UI는 선택 사항이며 기본 메인 빌드에서 제외됩니다.
// preview/ 디렉터리를 컴파일하고 패키징하려면 -Ppreview=true 옵션을 전달하세요.
def previewProperty = findProperty('preview')
def previewEnabled = previewProperty != null && previewProperty.toString().toBoolean()
def previewRoot = file('preview')
def previewAvailable = previewEnabled && previewRoot.isDirectory()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        if (previewAvailable) {
            // 이 빌드에서는 미리보기 컨트롤러가 페이지 경로를 담당합니다.
            // 소스 세트 구성 시 기본 페이지 컨트롤러를 제외하여 중복 매핑을 방지합니다.
            java {
                srcDir(new File(previewRoot, 'java'))
                exclude 'co/kr/spoit/web/CorePageController.java'
            }
            def previewResources = new File(previewRoot, 'resources')
            if (previewResources.isDirectory()) {
                resources.srcDir(previewResources)
            }
        }
    }
    test {
        if (previewAvailable) {
            java {
                srcDir(new File(previewRoot, 'test/java'))
                // 기본 경로 테스트는 모델이 비어 있는 페이지 컨트롤러를 검증하므로
                // 기본 빌드에만 포함합니다.
                exclude 'co/kr/spoit/web/CorePageRouteTest.java'
            }
        }
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // MyBatis - Spring Boot 3.5 호환
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 개발용
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 테스트용
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
