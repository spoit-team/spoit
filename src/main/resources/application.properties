spring.application.name=spoit
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.thymeleaf.cache=false

# --- MyBatis ---
# app_user.user_id 같은 스네이크 케이스 컬럼을 Member.userId 필드로 자동 매핑합니다.
mybatis.configuration.map-underscore-to-camel-case=true
# XML 매퍼 위치입니다. Java 패키지와 같은 폴더 구조로 두어 namespace와 대응시킵니다.
mybatis.mapper-locations=classpath:mapper/**/*.xml

# --- 로그인 ---
# remember-me 토큰 서명 키입니다. 값이 없으면 기동마다 임시 키를 만들어 쓰므로
# 재시작 시 로그인 유지 쿠키가 무효가 됩니다. 운영에서는 반드시 주입하세요.
# spoit.security.remember-me-key=${SPOIT_REMEMBER_ME_KEY}

# --- DB (본인 PC의 MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/spoit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- 사진 업로드 (매칭방 시설 사진) ---
# 사진 한 장 한도(5MB)는 서비스가 검사합니다. 서블릿 한도는 친절한 오류 문구를 보여 줄 수 있도록 더 크게 둡니다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# local(기본): 서버 디스크 spoit.upload.local-dir에 저장하고 /uploads/** 로 제공합니다. 로컬 개발용입니다.
# s3: AWS S3 버킷에 저장합니다. 운영 서버는 .env에 아래 환경 변수를 넣으세요.
#   SPOIT_UPLOAD_STORAGE=s3
#   SPOIT_UPLOAD_S3_BUCKET=버킷이름
#   SPOIT_UPLOAD_S3_REGION=ap-northeast-2
#   SPOIT_UPLOAD_S3_PUBLIC_BASE_URL=(선택) CloudFront 주소. 비우면 https://버킷.s3.리전.amazonaws.com
#   자격 증명은 EC2 인스턴스 역할 또는 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
spoit.upload.storage=${SPOIT_UPLOAD_STORAGE:local}
spoit.upload.local-dir=uploads
